name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - package.json
      - package-lock.json

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      DATABASE_URL: file:./prisma/placedv-local.db
      CI: true
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prepare runtime config
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const os = require("os");
          const path = require("path");

          const envPath = path.join(process.env.RUNNER_TEMP || os.tmpdir(), "windows-runtime.env");
          const entries = [
            ["NEXTAUTH_SECRET", process.env.NEXTAUTH_SECRET],
          ].filter(([, value]) => typeof value === "string" && value.trim());

          if (!process.env.NEXTAUTH_SECRET || !String(process.env.NEXTAUTH_SECRET).trim()) {
            throw new Error("NEXTAUTH_SECRET is required to build a production runtime config.");
          }

          const content = entries
            .map(([key, value]) => `${key}=${String(value).replace(/\r?\n/g, "\\n")}`)
            .join("\n");

          fs.writeFileSync(envPath, `${content}\n`, "utf8");
          console.log(`Runtime env written to ${envPath}`);
          NODE

          npm run runtime-config:generate -- --env "$RUNNER_TEMP/windows-runtime.env" --output build/runtime-config.json

      - name: Build Windows installer
        run: npm run dist:win -- --publish never

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: placedv-labs-windows
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error
