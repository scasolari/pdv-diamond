name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag matches package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "package.json version: ${PACKAGE_VERSION}"
          echo "tag version: ${TAG_VERSION}"

          if [ "${PACKAGE_VERSION}" != "${TAG_VERSION}" ]; then
            echo "Tag version must match package.json version."
            exit 1
          fi

  build-mac:
    runs-on: macos-latest
    needs:
      - validate-version

    env:
      DATABASE_URL: file:./prisma/placedv-local.db
      CI: true
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prepare Apple API key file
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const os = require("os");
          const path = require("path");

          const secret = (process.env.APPLE_API_KEY || "").trim();
          const keyId = (process.env.APPLE_API_KEY_ID || "AuthKey").trim();
          const tempDir = process.env.RUNNER_TEMP || os.tmpdir();
          const keyPath = path.join(tempDir, `AuthKey_${keyId}.p8`);

          let keyContent = secret;

          if (!keyContent.startsWith("-----BEGIN")) {
            keyContent = Buffer.from(keyContent, "base64").toString("utf8").trim();
          }

          fs.writeFileSync(keyPath, keyContent.endsWith("\n") ? keyContent : `${keyContent}\n`, "utf8");
          fs.chmodSync(keyPath, 0o600);
          fs.appendFileSync(process.env.GITHUB_ENV, `APPLE_API_KEY=${keyPath}\n`);

          console.log(`Apple API key written to ${keyPath}`);
          NODE

      - name: Build Mac installer
        run: npm run dist:mac -- --publish never

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/*.yml
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    needs:
      - validate-version

    env:
      DATABASE_URL: file:./prisma/placedv-local.db
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Windows installer
        run: npm run dist:win -- --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - validate-version
      - build-mac
      - build-windows
    permissions:
      contents: write

    steps:
      - name: Download Mac artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-mac
          path: release-assets

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
